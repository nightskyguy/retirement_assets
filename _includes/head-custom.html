<!-- _includes/head-custom.html

     GitHub Pages runs Jekyll over this repo and renders every .md file with its default
     theme (jekyll-theme-primer). That theme includes this file, if it exists, into the
     <head> of every rendered page - it is the theme's documented customization slot, and
     the only one used here. There is deliberately no _config.yml: if Jekyll ever stops
     picking this up, the docs pages simply look the way they did before it existed.

     Jekyll skips underscore-prefixed directories when publishing, so this file itself is
     never served. It also means there is no ?v= cache-busting story for the CSS below,
     which is why the CSS is inline rather than a fourth file: it ships with the page.

     The one dependency worth knowing about: DO NOT add a .nojekyll file to this repo.
     That would stop Jekyll entirely, and every .html docs URL on the site would 404. -->

<style>
  /* Back link injected by doclinks.js - these pages have no navigation otherwise. */
  .markdown-body .doc-nav {
    display: flex;
    gap: 1.25rem;
    margin: 0 0 1.5rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid #d0d7de;
    font-size: 14px;
  }

  /* Jekyll leaves a ```mermaid fence as plain text, so mark it as source rather than
     letting it read like a failed diagram. No mermaid library is loaded by design;
     the caption links to GitHub's blob view, which draws it. */
  .markdown-body .mermaid-caption {
    margin: 1rem 0 -0.5rem;
    font-size: 12px;
    color: #57606a;
  }

  .markdown-body pre.mermaid-source {
    border-left: 3px solid #d0d7de;
    color: #57606a;
    font-size: 11.5px;
    line-height: 1.45;
  }
</style>
